name: Docker build & push to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            dockerfile: apps/frontend/Dockerfile
            build_arg: NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          - service: backend
            dockerfile: apps/backend/Dockerfile
            build_arg: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: imagename
        run: |
          IMAGE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "full=${REGISTRY}/${IMAGE}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imagename.outputs.full }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{tag}},enable={{is_tag}}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_arg }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

# Runtime env vars are applied at DEPLOY time (never baked into the image).
# Create these secrets in the repo: Settings > Secrets and variables > Actions
#
#   NEXT_PUBLIC_API_URL   (frontend, build-time ONLY - client-visible)
#   DATABASE_URL          (backend)
#   SECRET_KEY            (backend)
#   CORS_ORIGINS          (backend)
#   GOOGLE_MAPS_API_KEY   (frontend, server-side reverse geocoding)
#   LIVEKIT_URL           (frontend)
#   LIVEKIT_API_KEY       (frontend)
#   LIVEKIT_API_SECRET    (frontend)